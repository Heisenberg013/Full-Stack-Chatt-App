services:
  mongodb:
    image: mongo:7
    container_name: chatapp_mongodb
    restart: always
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    ports:
      - "27017:27017"
    networks:
      - fullstack-chatapp

  backend:
    build:
      context: ./backend
    container_name: full-stack_backend
    restart: always
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongoadmin:secret@mongodb:27017/dbname?authSource=admin
      - JWT_SECRET=supersecretkey
      - PORT=5001
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
    networks:
      - fullstack-chatapp

  frontend:
    build:
      context: ./frontend
    container_name: full-stack_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fullstack-chatapp

networks:
  fullstack-chatapp:
    driver: bridge

volumes:
  mongo-data:
